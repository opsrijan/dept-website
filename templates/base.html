<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Department Website{% endblock %}</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"
    >
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{% url 'core:home' %}">Department</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'core:home' %}">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'core:department' %}">Department</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'academics:index' %}">Academic</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'internships:index' %}">Internship</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'placements:index' %}">Placement</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'opportunities:index' %}">Opportunities</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'alumni:index' %}">Alumni</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'team:index' %}">Team</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'gallery:index' %}">Gallery</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'leaderboard:index' %}">Leaderboard</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"
    ></script>
</body>
</html>
